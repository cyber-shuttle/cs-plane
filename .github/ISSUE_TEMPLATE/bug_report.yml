name: Bug report
description: Something cs-plane does not do, or does wrong
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the exact error message or HTTP status if there was one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. cs serve --oidc-client-id ... --custos-url ... --allowed-origin ...
        2. POST /api/v1/sessions with ...
        3. ...
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: There are no releases yet, so name the commit you built from (`git rev-parse --short HEAD`).
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version
      description: Output of `go version`.
  - type: textarea
    id: invocation
    attributes:
      label: How you started cs-plane
      description: The `cs serve` command line, with the tenant ID replaced.
      render: shell
  - type: textarea
    id: cluster
    attributes:
      label: Cluster
      description: >
        For anything involving SSH, Slurm or a session: what scheduler and version the SSH host runs,
        whether the SSH host has outbound internet to astral.sh and github.com, and whether it had
        been prepared before.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        cs-plane output and any session log tail. Redact OIDC ID tokens, Dev Tunnel host and connect tokens, link
        tokens and Jupyter tokens before pasting.
      render: shell
  - type: markdown
    attributes:
      value: >
        If this is a security vulnerability, close this form and report it privately instead — see
        [SECURITY.md](https://github.com/cyber-shuttle/cs-plane/blob/main/SECURITY.md).
